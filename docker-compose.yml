services:
  burrow:
    build: .
    container_name: burrow
    restart: unless-stopped
    ports:
      # Exposed on port 8787 by default (override with BURROW_PORT in .env).
      # If using Cloudflare Tunnel only, you can switch this to
      # "127.0.0.1:8787:8787" or remove ports entirely.
      - "${BURROW_PORT:-8787}:8787"
      # Vanilla Minecraft join-code ingress (<CODE>.burrow.meeyah.dev:25565).
      - "${BURROW_TCP_PORT:-25565}:25565"
    volumes:
      - burrow-data:/data
    environment:
      BURROW_TCP_BIND: "${BURROW_TCP_BIND:-0.0.0.0:25565}"
      BURROW_DEV_MODE: "${BURROW_DEV_MODE:-0}"
      BURROW_ADMIN_TOKEN: "${BURROW_ADMIN_TOKEN:-}"
      BURROW_DISCORD_CLIENT_ID: "${BURROW_DISCORD_CLIENT_ID:-}"
      BURROW_DISCORD_CLIENT_SECRET: "${BURROW_DISCORD_CLIENT_SECRET:-}"
      BURROW_DISCORD_REDIRECT_URI: "${BURROW_DISCORD_REDIRECT_URI:-}"
      BURROW_DISCORD_ALLOWED_USER_ID: "${BURROW_DISCORD_ALLOWED_USER_ID:-}"
      BURROW_SECURE_COOKIES: "${BURROW_SECURE_COOKIES:-1}"

  # Optional Cloudflare Tunnel sidecar.
  # Start with: docker compose --profile tunnel up -d --build
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: burrow-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - burrow

volumes:
  burrow-data:
